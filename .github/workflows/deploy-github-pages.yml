name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
  # Marketplace sibling cannot trigger this repo without a PAT; poll main hourly.
  schedule:
    - cron: '12 * * * *'
  repository_dispatch:
    types: [marketplace-updated]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout admin
        uses: actions/checkout@v4

      - name: Checkout marketplace (sibling)
        uses: actions/checkout@v4
        with:
          repository: kresha325/Binisoft-marketplace
          path: Binisoft-marketplace
          # Always ship latest marketplace main (Pages does not watch that repo).
          ref: main
          fetch-depth: 1

      - name: Marketplace revision
        run: |
          SHA=$(git -C Binisoft-marketplace rev-parse HEAD)
          echo "Marketplace SHA: $SHA"
          git -C Binisoft-marketplace log -1 --oneline
          echo "$SHA" > tool/marketplace.ref

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Binisoft-marketplace/package-lock.json

      - name: Assemble /admin + /shop under /binisoft-ad/
        env:
          MARKETPLACE_DIR: ${{ github.workspace }}/Binisoft-marketplace
          OUT: ${{ github.workspace }}/build/web
          SITE_PREFIX: /binisoft-ad
        run: |
          chmod +x tool/assemble_unified_hosting.sh
          ./tool/assemble_unified_hosting.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
